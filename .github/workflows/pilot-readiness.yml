name: Olin pilot readiness

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: pilot-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase0-test-only
          POSTGRES_DB: olin_investigator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d olin_investigator_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OLIN_INVESTIGATOR_TEST_ADMIN_DSN: postgresql://postgres:phase0-test-only@127.0.0.1:5432/olin_investigator_test
      OLIN_INVESTIGATOR_TEST_DISPOSABLE: "YES"
      OLIN_INVESTIGATOR_REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip check
      - name: Validate API contract
        run: python -m json.tool docs/openapi-v1.json >/dev/null
      - name: Compile Python
        run: python -m compileall -q olin scripts test_live_readiness.py
      - name: Run required Investigator PostgreSQL boundary suite
        run: python -m unittest -v test_investigator_postgres_rls
      - name: Run pilot safety suite
        run: python -m unittest discover -v
      - name: Run legacy compatibility checks
        run: |
          python -m olin.test_v2
          python test_full_flow.py
          python test_belvo_pipeline.py
      - name: Run 1,000-case synthetic gate
        run: python -m olin.synthetic_portfolio --cases 1000 --seed 42

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
