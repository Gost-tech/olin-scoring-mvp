name: Olin pilot readiness

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

concurrency:
  group: pilot-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock.txt
      - run: python -m pip check
      - name: Validate API contract
        run: python -m json.tool docs/openapi-v1.json >/dev/null
      - name: Compile Python
        run: python -m compileall -q olin scripts test_live_readiness.py
      - name: Run pilot safety suite
        run: python -m unittest discover -v
      - name: Run legacy compatibility checks
        run: |
          python -m olin.test_v2
          python test_full_flow.py
          python test_belvo_pipeline.py
      - name: Run 1,000-case synthetic gate
        run: python -m olin.synthetic_portfolio --cases 1000 --seed 42

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
