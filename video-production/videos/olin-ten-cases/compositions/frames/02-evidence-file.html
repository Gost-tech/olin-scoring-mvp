  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const composition = document.querySelector('[data-composition-id="02-evidence-file"]');
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["02-evidence-file"] = tl;

      const chips = Array.from(composition.querySelectorAll('[data-02e-chip]'));
      const CONTENT = chips.map((element) => ({
        element,
        title: element.textContent.trim(),
        hold: 0.08,
      }));
      const BASE_DURATION = 0.28;
      const SEC_PER_CHAR = 0.012;
      let cumulative = 0.08;
      const TIMELINE = CONTENT.map((entry) => {
        const duration = BASE_DURATION + entry.title.length * SEC_PER_CHAR + entry.hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });

      TIMELINE.forEach((entry) => {
        const targetX = Number(entry.element.dataset.targetX);
        const targetY = Number(entry.element.dataset.targetY);
        tl.fromTo(
          entry.element,
          { xPercent: -50, yPercent: -50, x: targetX - 74, y: targetY, opacity: 0, scale: 0.92 },
          { xPercent: -50, yPercent: -50, x: targetX, y: targetY, opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
          entry.start,
        );
      });

      tl.fromTo(
        composition.querySelector('[id="02-evidence-file-stage-label"]'),
        { opacity: 0, y: -14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.04,
      );

      tl.fromTo(
        composition.querySelector('[id="02-evidence-file-path"]'),
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "none" },
        1.72,
      );

      chips.forEach((chip, index) => {
        tl.to(
          chip,
          {
            x: 0,
            y: 0,
            scale: 0.58,
            opacity: 0,
            duration: 0.72,
            ease: "power3.out",
          },
          1.8 + index * 0.055,
        );
      });

      tl.to(
        composition.querySelector('[id="02-evidence-file-path"]'),
        { opacity: 0, duration: 0.38, ease: "power2.out" },
        2.1,
      );

      const screenWrap = composition.querySelector('[id="02-evidence-file-screen-wrap"]');
      const intake = composition.querySelector('[id="02-evidence-file-intake"]');
      const evidence = composition.querySelector('[id="02-evidence-file-evidence"]');
      const signal = composition.querySelector('[id="02-evidence-file-signal"]');

      gsap.set(screenWrap, { opacity: 0, scale: 0.72, y: 34 });
      gsap.set(intake, { opacity: 1, scale: 1 });
      gsap.set(evidence, { opacity: 0, scale: 0.72 });
      gsap.set(signal, { opacity: 0, scaleX: 0.84, scaleY: 0.9 });

      tl.to(
        screenWrap,
        { opacity: 1, scale: 1, y: 0, duration: 0.68, ease: "back.out(1.4)" },
        2.22,
      );

      const SWAP_TRIGGER = 3.34;
      const EXIT_DURATION = 0.38;
      const OVERLAP = 0.14;
      tl.to(
        intake,
        { scale: 0.72, opacity: 0, duration: EXIT_DURATION, ease: "power2.in" },
        SWAP_TRIGGER,
      );
      tl.to(
        evidence,
        { scale: 1, opacity: 1, duration: 0.62, ease: "back.out(1.4)" },
        SWAP_TRIGGER + EXIT_DURATION - OVERLAP,
      );

      tl.fromTo(
        signal,
        { opacity: 0, scaleX: 0.84, scaleY: 0.9 },
        { opacity: 1, scaleX: 1, scaleY: 1, duration: 0.52, ease: "power3.out" },
        4.3,
      );

      const hackerWrap = composition.querySelector('[id="02-evidence-file-hacker-text"]');
      const targetWord = hackerWrap.dataset.target;
      const ghost = document.createElement('div');
      ghost.className = '02-evidence-file-hacker-ghost';
      ghost.textContent = targetWord;
      hackerWrap.appendChild(ghost);

      const charElements = Array.from(targetWord).map((character) => {
        const span = document.createElement('span');
        span.className = '02-evidence-file-hacker-char';
        span.textContent = character;
        span.dataset.target = character;
        hackerWrap.appendChild(span);
        return span;
      });

      const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*';
      function pseudoGlyph(seed) {
        const hash = ((seed * 9301 + 49297) % 233280) / 233280;
        return GLYPHS[Math.floor(hash * GLYPHS.length)];
      }

      charElements.forEach((element, index) => {
        const state = { progress: 0 };
        tl.to(
          state,
          {
            progress: 1,
            duration: 0.72,
            ease: "power3.out",
            onUpdate: () => {
              if (state.progress < 0.62) {
                element.textContent = pseudoGlyph(index * 1000 + Math.floor(state.progress * 8));
              } else {
                element.textContent = element.dataset.target;
              }
              element.style.transform = `rotateX(${90 - state.progress * 90}deg)`;
              element.style.opacity = String(Math.min(1, state.progress * 2));
            },
          },
          4.42 + index * 0.055,
        );
      });
    })();
  </script>
