  <script>
    (() => {
      const root = document.querySelector('[data-composition-id="03-explained"]');
      if (!root || !window.gsap) return;

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["03-explained"] = tl;

      const card = root.querySelector('.f03-explained-card-shell');
      const oldContent = root.querySelector('.f03-explained-card-old');
      const newContent = root.querySelector('.f03-explained-card-new');
      const scan = root.querySelector('.f03-explained-scan');
      const words = Array.from(root.querySelectorAll('.f03-explained-word'));
      const progressFill = root.querySelector('.f03-explained-progress-fill');

      tl.fromTo(card, { opacity: 0, x: 54, y: 12, rotation: 2.2 }, { opacity: 1, x: 0, y: 0, rotation: -1.6, duration: 0.48, ease: 'power2.out' }, 0.02);
      tl.fromTo(root.querySelector('.f03-explained-kicker'), { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out' }, 0.08);
      tl.fromTo(root.querySelectorAll('.f03-explained-audit-row'), { opacity: 0, x: -22 }, { opacity: 1, x: 0, duration: 0.42, stagger: 0.58, ease: 'power2.out' }, 0.22);

      const spoken = {
        fuente: { start: 0.30, end: 0.62 },
        faltante: { start: 0.92, end: 1.28 },
        regla: { start: 1.58, end: 1.94 }
      };
      const glowDriver = { t: 0 };
      const attack = 0.14;
      const release = 0.34;
      const rest = 0.10;
      const envelope = (time, start, end) => {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / attack, 1);
        const releaseEnd = end + release;
        if (time < releaseEnd) return 1 - ((time - end) / release) * (1 - rest);
        return rest;
      };
      const channel = (a, b, amount) => Math.round(a + (b - a) * amount);
      tl.to(glowDriver, {
        t: 2.2,
        duration: 2.2,
        ease: 'none',
        onUpdate: () => {
          words.forEach((word) => {
            const timing = spoken[word.dataset.word];
            const env = envelope(glowDriver.t, timing.start, timing.end);
            word.style.color = `rgb(${channel(154, 11, env)}, ${channel(154, 25, env)}, ${channel(154, 22, env)})`;
            word.style.textShadow = `0 0 ${38 * env}px rgba(200,250,90,${0.78 * env})`;
            word.style.transform = `scale(${1 + 0.19 * env})`;
          });
        }
      }, 0);

      tl.fromTo(scan, { opacity: 0, scaleX: 0, y: 40 }, { opacity: 1, scaleX: 1, y: 255, duration: 0.52, ease: 'power2.inOut' }, 2.20);
      tl.to(scan, { opacity: 0, duration: 0.18, ease: 'power1.out' }, 2.70);

      tl.to(card, {
        scale: 1.12,
        x: 10,
        y: 80,
        rotation: 0,
        borderRadius: 12.5,
        backgroundColor: 'rgba(200,250,90,0.08)',
        duration: 0.92,
        ease: 'power2.inOut'
      }, 2.58);
      tl.to(oldContent, { opacity: 0, duration: 0.36, ease: 'power1.in' }, 2.58);
      tl.to(newContent, { opacity: 1, duration: 0.36, ease: 'power1.out' }, 3.14);
      tl.fromTo(root.querySelector('.f03-explained-proof-label'), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.42, ease: 'power2.out' }, 3.62);

      const sequenceContent = [
        { key: 'llega', body: 'LLEGA', hold: 0.20 },
        { key: 'explicada', body: 'EXPLICADA', hold: 0.68 }
      ];
      const baseDuration = 0.30;
      const secondsPerCharacter = 0.018;
      let cumulative = 0;
      const sequenceTimeline = sequenceContent.map((entry) => {
        const start = cumulative;
        cumulative += baseDuration + entry.body.length * secondsPerCharacter + entry.hold;
        return { ...entry, start, end: cumulative };
      });
      const sequenceElements = Array.from(root.querySelectorAll('.f03-explained-seq-item'));
      sequenceTimeline.forEach((entry, index) => {
        const el = sequenceElements[index];
        tl.fromTo(el, { opacity: 0, x: -26, y: 12 }, { opacity: 1, x: 0, y: 0, duration: 0.48, ease: 'power2.out' }, 4.80 + entry.start);
      });

      const rulePath = root.querySelector('[id="03-explained-rule-path"]');
      const pathLength = rulePath.getTotalLength();
      rulePath.style.strokeDasharray = `${pathLength}`;
      rulePath.style.strokeDashoffset = `${pathLength}`;
      tl.to(rulePath, { strokeDashoffset: 0, duration: 0.78, ease: 'power2.out' }, 5.08);
      tl.fromTo(root.querySelector('[id="03-explained-rule-dot"]'), { opacity: 0, scale: 0.5, transformOrigin: '50% 50%' }, { opacity: 1, scale: 1, duration: 0.28, ease: 'power2.out' }, 5.82);
      tl.fromTo(root.querySelector('.f03-explained-rationale-tag'), { opacity: 0, x: 14 }, { opacity: 1, x: 0, duration: 0.42, ease: 'power2.out' }, 6.06);
      tl.fromTo(progressFill, { scaleX: 0 }, { scaleX: 1, duration: 6.58, ease: 'none' }, 0.02);
    })();
