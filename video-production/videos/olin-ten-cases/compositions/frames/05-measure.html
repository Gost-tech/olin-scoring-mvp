  <script>
    (() => {
      const duration = 6.648;
      const typeEl = document.getElementById("05-measure-type");
      const cursorEl = document.getElementById("05-measure-cursor");
      const sequence = [
        { t: 0.00, text: "", color: "#c55232" },
        { t: 0.12, text: "PIL", color: "#c55232" },
        { t: 0.28, text: "PILOTO", color: "#0b1916" },
        { t: 0.52, text: "PILOTO ", color: "#9a9a9a" },
        { t: 0.70, text: "PILOTO EN", color: "#c55232" },
        { t: 0.92, text: "PILOTO EN PAR", color: "#c55232" },
        { t: 1.12, text: "PILOTO EN PARALELO", color: "#c8fa5a" }
      ];
      const changeTimes = sequence.slice(1).map((entry) => entry.t);
      const typeDriver = { t: 0 };
      const blinkDriver = { p: 0 };

      function entryAt(time) {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index];
        }
        return sequence[0];
      }

      const tl = gsap.timeline({ paused: true });

      tl.to(typeDriver, {
        t: 1.6,
        duration: 1.6,
        ease: "none",
        onUpdate: () => {
          const entry = entryAt(typeDriver.t);
          typeEl.textContent = entry.text;
          cursorEl.style.background = entry.color;
        }
      }, 0);

      tl.to(blinkDriver, {
        p: Math.PI * 4,
        duration: 1.6,
        ease: "none",
        onUpdate: () => {
          const typing = changeTimes.some((time) => time <= typeDriver.t && typeDriver.t - time < 0.15);
          cursorEl.style.opacity = typing || Math.sin(blinkDriver.p) > 0 ? "1" : "0";
        }
      }, 0);

      [1, 2, 3, 4].forEach((number, index) => {
        const at = 1.6 + index * 0.76;
        tl.fromTo(document.getElementById(`05-measure-card-${number}`),
          { opacity: 0, y: 30, scale: 0.96 },
          { opacity: 1, y: 0, scale: 1, duration: 0.46, ease: "power3.out" },
          at
        );
        tl.fromTo(document.getElementById(`05-measure-fill-${number}`),
          { scaleX: 0 },
          { scaleX: 1, duration: 0.82, ease: "power2.out" },
          at + 0.12
        );
      });

      tl.to(document.getElementById("05-measure-grid"), {
        scale: 0.72,
        opacity: 0,
        duration: 0.4,
        ease: "power2.in"
      }, 4.8);

      tl.fromTo(document.getElementById("05-measure-signal"),
        { scale: 0.72, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.62, ease: "back.out(1.8)" },
        5.04
      );

      tl.fromTo(document.getElementById("05-measure-rail-fill"),
        { scaleX: 0 },
        { scaleX: 1, duration: 0.72, ease: "power2.out" },
        5.42
      );

      tl.to({}, { duration: duration - 6.14 }, 6.14);
      window.__timelines = window.__timelines || {};
      window.__timelines["05-measure"] = tl;
    })();
  </script>
